name: promote-from-qa

# PROD pulls QA. This workflow lives on AI4AI-Labs/Talmudic-AI-memory.
# It never runs on the QA repository and never pushes to QA.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact QA main commit SHA approved for promotion"
        required: true
        type: string
      version:
        description: "Exact release version (for example 0.3.0b1)"
        required: true
        type: string

concurrency:
  group: production-promotion
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  promote:
    name: "Pull exact QA SHA and open PROD PR"
    if: github.repository == 'AI4AI-Labs/Talmudic-AI-memory' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      VERSION: ${{ inputs.version }}
      QA_REPO: gilav2/Talmudic-AI-memory
      PROD_REPO: AI4AI-Labs/Talmudic-AI-memory
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "expected_sha must be a 40-character lowercase hex SHA" >&2
            exit 1
          }
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([ab][0-9]+)?$' || {
            echo "version must look like 0.3.0 or 0.3.0b1" >&2
            exit 1
          }

      - name: Checkout production repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create promotion branch from PROD main
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          short="${EXPECTED_SHA::12}"
          branch="promote/v${VERSION}-${short}"
          git fetch origin main
          git checkout -B "$branch" origin/main
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Clone exact QA SHA outside the PROD worktree (read-only)
        env:
          QA_READ_TOKEN: ${{ secrets.QA_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          qa="${RUNNER_TEMP}/qa"
          git clone --no-checkout "https://x-access-token:${QA_READ_TOKEN}@github.com/${QA_REPO}.git" "$qa"
          git -C "$qa" checkout --detach "$EXPECTED_SHA"
          git -C "$qa" fetch --no-tags origin main
          test "$(git -C "$qa" rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo "QA checkout HEAD is not the approved SHA" >&2
            exit 1
          }
          git -C "$qa" merge-base --is-ancestor "$EXPECTED_SHA" origin/main || {
            echo "Refusing promotion: $EXPECTED_SHA is not on ${QA_REPO} main" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build allowlisted production tree with PROD-owned policy
        id: pipeline
        shell: bash
        run: |
          set -euo pipefail
          qa="${RUNNER_TEMP}/qa"
          pipeline="${GITHUB_WORKSPACE}"
          test -f "$pipeline/scripts/build_production_tree.py" || {
            echo "PROD-owned builder missing; refusing to execute promotion policy from QA" >&2
            exit 1
          }
          test -f "$pipeline/release/production-files.txt" || {
            echo "PROD-owned allowlist missing; refusing to trust QA release policy" >&2
            exit 1
          }
          echo "root=$pipeline" >> "$GITHUB_OUTPUT"
          python "$pipeline/scripts/build_production_tree.py" \
            --source "$qa" \
            --pipeline-root "$pipeline" \
            --out "${RUNNER_TEMP}/prod-tree" \
            --version "$VERSION" \
            --source-sha "$EXPECTED_SHA" \
            --prod-repo "$PROD_REPO"

      - name: Apply tree without wiping PROD git metadata
        shell: bash
        run: |
          set -euo pipefail
          python "${{ steps.pipeline.outputs.root }}/scripts/build_production_tree.py" \
            --apply-only \
            --out "${RUNNER_TEMP}/prod-tree" \
            --apply-to "$GITHUB_WORKSPACE"

      - name: Reject runtime/private residue
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "${GITHUB_WORKSPACE}/.talmudic"
          test ! -d "${GITHUB_WORKSPACE}/qa"
          if find "${GITHUB_WORKSPACE}" -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name 'id_rsa' -o -name 'id_ed25519' \) -print -quit | grep -q .; then
            echo "sensitive file leaked into production working tree" >&2
            exit 1
          fi

      - name: Commit promotion branch — never force-push main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "talmudic-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "Refusing empty promotion: production already matches this artifact" >&2
            exit 1
          }
          git commit -m "promote: Talmudic AI Memory ${VERSION} from QA ${EXPECTED_SHA}"
          git push -u origin "${{ steps.branch.outputs.branch }}"

      - name: Open production PR — never auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --repo "$PROD_REPO" \
            --base main \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "Promote Talmudic AI Memory ${VERSION}" \
            --body "QA source: \`${QA_REPO}@${EXPECTED_SHA}\`

          Version: \`${VERSION}\`

          This PR was pulled by PROD from an allowlisted QA export. It must pass production CI and human review. **Do not auto-merge. Do not force-push main.**"

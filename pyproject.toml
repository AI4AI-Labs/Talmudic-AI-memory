[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talmudic-memory"
version = "0.3.0b1"
description = "Resumable work-state memory for long-running AI agents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Talmudic AI Memory contributors"}]
dependencies = []

[project.scripts]
talmudic = "talmudic_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
